services:
  - type: web
    name: nutrilens-app
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: VISION_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false

